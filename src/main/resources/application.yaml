server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: inno-auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:postgres-auth}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:17052007}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/innowise-realm}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
  show-actuator: true
  cache:
    disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
    tags:
      application: ${spring.application.name}
      service: auth-service
      environment: ${ENVIRONMENT:dev}
  observations:
    key-values:
      application: ${spring.application.name}
      service: auth-service
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://tempo:4318/v1/traces}

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8088}
  realm: ${KEYCLOAK_REALM:innowise-realm}
  resource: ${KEYCLOAK_RESOURCE:innowise-client}
  admin:
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: admin-cli
  client-id: ${KEYCLOAK_CLIENT_ID:innowise-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

info:
  app:
    name: InnoAuthService
    description: Spring Boot Auth Service with JWT Authentication
    version: 1.0.0
    java:
      version: 21
